<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Reports with Globe Background</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      overflow: auto;
    }
    #background {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: -1;
    }
    .container {
      position: relative;
      max-width: 600px;
      margin: 2rem auto;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1;
    }
    .top-nav {
      text-align: right; margin-bottom: 1rem;
    }
    .top-nav a {
      background:#FFD700; padding: 0.6rem 1rem; border-radius:6px;
      text-decoration:none; color: #333; border: 1px solid #999;
      font-weight: bold;
    }
    .top-nav a:hover { background: #ffe066; }
    .report {
      border: 1px solid #ccc;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 6px;
      background: #f9f9f9;
    }
    .report h3 { margin: 0 0 0.4rem 0; }
    .report .date { font-size: 0.9rem; color: #888; }
    .report .location {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.4rem;
    }
    .no-reports { text-align:center; color: #888; padding:2rem 0; }
  </style>
</head>
<body>
  <div id="background"></div>
  <div class="container">
    <div class="top-nav">
      <a href="report.html">Report</a>
    </div>
    <h2>Live Reports</h2>
    <div id="reportsContainer"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script>
    VANTA.GLOBE({
      el: "#background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xff0000,
      color2: 0xe3ff00,
      backgroundColor: 0x000000
    });

    const container = document.getElementById('reportsContainer');

    // Remove reports older than 30 mins
    function removeOldReports(reports, expiryMinutes = 30) {
      const cutoff = Date.now() - expiryMinutes * 60000;
      return reports.filter(r => r.id > cutoff);
    }

    let reports = JSON.parse(localStorage.getItem('reports')) || [];
    reports = removeOldReports(reports);
    localStorage.setItem('reports', JSON.stringify(reports));

    if (reports.length === 0) {
      container.innerHTML = '<div class="no-reports">No reports available.</div>';
    } else {
      reports.slice().reverse().forEach(report => {
        const div = document.createElement('div');
        div.className = 'report';
        div.innerHTML = `
          <h3>${report.type}</h3>
          <div class="date">${report.date}</div>
          <p>${report.details}</p>
          <div class="location">Location: ${report.latitude !== undefined && report.latitude !== null ? report.latitude.toFixed(6) : 'N/A'}, ${report.longitude !== undefined && report.longitude !== null ? report.longitude.toFixed(6) : 'N/A'}</div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
