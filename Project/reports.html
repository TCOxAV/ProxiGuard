<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Reports with Proximity Color</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; overflow: auto; }
    #background { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }
    .container {
      position: relative; max-width: 600px; margin: 2rem auto;
      background-color: rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px);
      border-radius: 10px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1;
    }
    .top-nav { text-align: right; margin-bottom: 1rem; }
    .top-nav a {
      background: #FFD700; padding: 0.6rem 1rem; border-radius: 6px;
      text-decoration: none; color: #333; border: 1px solid #999; font-weight: bold;
    }
    .top-nav a:hover { background: #ffe066; }
    .report {
      border: 1px solid #ccc; padding: 1rem; margin-bottom: 1.5rem; border-radius: 6px;
      background: #f9f9f9; cursor: pointer; transition: background-color 0.2s ease;
    }
    .report:hover { background-color: #f0f0f0; }
    .report h3 { margin: 0 0 0.4rem 0; }
    .report .date { font-size: 0.9rem; color: #888; }
    .report .location { font-size: 0.85rem; color: #666; margin-top: 0.4rem; word-wrap: break-word; }
    .no-reports { text-align: center; color: #888; padding: 2rem 0; }
    #detailModal {
      display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
      overflow-auto: auto; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    }
    #modalContent {
      background-color: #fff; margin: 10% auto; padding: 2rem; border-radius: 10px;
      width: 90%; max-width: 500px; position: relative;
    }
    #modalContent h3 { margin-top: 0; color: #cc7a00; }
    #closeModal {
      position: absolute; top: 10px; right: 15px; font-size: 1.4em;
      font-weight: bold; cursor: pointer; border: none; background: none;
    }
    #modalContent p { white-space: pre-wrap; }
    #distanceDisplay {
      margin-top: 1rem; font-weight: bold; color: black; transition: color 0.7s ease;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div class="container" role="main" aria-label="Live Emergency Reports">
    <div class="top-nav">
      <a href="report.html">Report</a>
    </div>
    <h2>Live Reports</h2>
    <div id="reportsContainer" aria-live="polite" aria-relevant="additions"></div>
  </div>
  <div id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalContent">
      <button id="closeModal" aria-label="Close details modal">&times;</button>
      <h3 id="modalTitle"></h3>
      <div id="modalDate"></div>
      <p id="modalDetails"></p>
      <div class="location" id="modalLocation"></div>
      <div id="distanceDisplay"></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script>
    VANTA.GLOBE({
      el: "#background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200,
      minWidth: 200,
      scale: 1,
      scaleMobile: 1,
      color: 0xff0000,
      color2: 0xe3ff00,
      backgroundColor: 0x000000
    });
    const container = document.getElementById('reportsContainer');
    const modal = document.getElementById('detailModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDate = document.getElementById('modalDate');
    const modalDetails = document.getElementById('modalDetails');
    const modalLocation = document.getElementById('modalLocation');
    const distanceDisplay = document.getElementById('distanceDisplay');
    const closeModalBtn = document.getElementById('closeModal');
    let currentLatitude = null;
    let currentLongitude = null;
    function getThresholdByType(type) {
      switch(type) {
        case 'Medical/Accident': return 2.5;
        case 'Hazard/Chemical': return 5;
        case 'Natural Calamities/Destruction': return 10;
        default: return 5;
      }
    }
    function interpolateColor(ratio) {
      const r = Math.floor(255 * (1 - ratio));
      const g = Math.floor(255 * ratio);
      return `rgb(${r},${g},0)`;
    }
    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = degreesToRadians(lat2 - lat1);
      const dLon = degreesToRadians(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(degreesToRadians(lat1)) * Math.cos(degreesToRadians(lat2)) *
                Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }
    function degreesToRadians(deg) {
      return deg * (Math.PI / 180);
    }
    function removeOldReports(reports, expiryMins = 30) {
      const cutoff = Date.now() - expiryMins * 60000;
      return reports.filter(r => r.id > cutoff);
    }
    let reports = JSON.parse(localStorage.getItem('reports')) || [];
    reports = removeOldReports(reports);
    localStorage.setItem('reports', JSON.stringify(reports));
    if (reports.length === 0) {
      container.innerHTML = '<div class="no-reports">No reports available.</div>';
    } else {
      container.innerHTML = '';
      reports.slice().reverse().forEach((report, idx) => {
        const div = document.createElement('div');
        div.className = 'report';
        div.tabIndex = 0;
        div.setAttribute('role', 'button');
        div.setAttribute('aria-describedby', `reportDesc${idx}`);
        div.innerHTML = `
          <h3>${report.type}</h3>
          <div class="date">${report.date}</div>
          <p id="reportDesc${idx}" class="location">Location: ${
            report.latitude !== undefined && report.latitude !== null ? report.latitude.toFixed(6) : 'N/A'
          }, ${
            report.longitude !== undefined && report.longitude !== null ? report.longitude.toFixed(6) : 'N/A'
          }</p>
        `;
        div.addEventListener('click', () => openModal(report));
        div.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') openModal(report); });
        container.appendChild(div);
      });
    }
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        pos => {
          currentLatitude = pos.coords.latitude;
          currentLongitude = pos.coords.longitude;
          if (modal.style.display === 'block' && modal.currentReport) {
            updateDistanceDisplay(modal.currentReport);
          }
        },
        err => {
          distanceDisplay.textContent = 'Could not update location.';
        },
        {enableHighAccuracy: true, maximumAge: 0, timeout: 8000}
      );
    }
    function openModal(report) {
      modal.currentReport = report;
      modalTitle.textContent = report.type;
      modalDate.textContent = report.date;
      modalDetails.textContent = report.details;
      modalLocation.textContent = `Location: ${
        report.latitude !== undefined && report.latitude !== null ? report.latitude.toFixed(6) : 'N/A'
      }, ${
        report.longitude !== undefined && report.longitude !== null ? report.longitude.toFixed(6) : 'N/A'
      }`;
      modal.style.display = 'block';
      updateDistanceDisplay(report);
      closeModalBtn.focus();
    }
    function updateDistanceDisplay(report) {
      if (currentLatitude === null || currentLongitude === null) {
        distanceDisplay.textContent = 'Your current location not available';
        distanceDisplay.style.color = 'black';
        return;
      }
      if (report.latitude === null || report.longitude === null) {
        distanceDisplay.textContent = 'Report location unavailable';
        distanceDisplay.style.color = 'black';
        return;
      }
      const dist = getDistanceFromLatLonInMeters(currentLatitude, currentLongitude, report.latitude, report.longitude);
      const threshold = getThresholdByType(report.type);
      let color;
      if (dist <= threshold) {
        color = 'rgb(255,0,0)';
      } else if (dist > threshold && dist <= threshold + 2) {
        const fadeRatio = (dist - threshold) / 2;
        const r = Math.floor(255 * (1 - fadeRatio));
        const g = Math.floor(255 * fadeRatio);
        color = `rgb(${r},${g},0)`;
      } else {
        color = 'rgb(0,255,0)';
      }
      distanceDisplay.textContent = `Distance from your current location: ${dist.toFixed(1)} meters`;
      distanceDisplay.style.color = color;
    }
    closeModalBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      modal.currentReport = null;
    });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.style.display === 'block') {
        modal.style.display = 'none';
        modal.currentReport = null;
      }
    });
    modal.addEventListener('click', e => {
      if (e.target === modal) {
        modal.style.display = 'none';
        modal.currentReport = null;
      }
    });
  </script>
</body>
</html>
