<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emergency Reporting with Background</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #background {
      position: fixed;
      width: 100%; height: 100%;
      z-index: -1;
      top: 0; left: 0;
    }
    .container {
      position: relative;
      max-width: 600px; 
      margin: 2rem auto; 
      background-color: rgba(255, 255, 255, 0.93);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 1;
    }
    .top-nav {
      text-align: right; margin-bottom: 1rem;
    }
    .top-nav a {
      background:#FFD700; padding: 0.6rem 1rem; border-radius:6px;
      text-decoration:none; color: #333; border: 1px solid #999;
      font-weight: bold;
    }
    .top-nav a:hover { background: #ffe066; }
    label { margin-top: 1rem; display: block; }
    select, textarea {
      width: 100%; margin-top: 0.5rem; padding: 0.7rem;
      font-size: 1em; border-radius: 5px; border:1px solid #ccc;
      box-sizing: border-box;
    }
    textarea { resize: vertical; height: 100px; }
    button {
      margin-top: 1.5rem; width: 100%; padding: 0.8rem;
      font-size: 1em; border-radius: 5px; border: none;
      background-color: #4CAF50; color: white; cursor: pointer;
    }
    button:hover { background-color: #388E3C; }
    #micButton {
      background-color: #ff6666; border: none;
      border-radius: 50%; width: 40px; height: 40px;
      cursor: pointer; margin-left: 10px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div class="container">
    <div class="top-nav">
      <a href="reports.html" target="_blank">View Live Reports</a>
    </div>
    <h2>Submit Emergency Report</h2>
    <form id="reportForm">
      <label for="typeOfEmergency">Type of Emergency</label>
      <select id="typeOfEmergency" required>
        <option value="">-- Select --</option>
        <option value="Medical/Accident">Medical/Accident</option>
        <option value="Hazard/Chemical">Hazard/Chemical</option>
        <option value="Natural Calamities/Destruction">Natural Calamities/Destruction</option>
        <option value="Other">Other</option>
      </select>
      <label for="details">Details
        <button type="button" id="micButton" title="Click to Speak"></button>
      </label>
      <textarea id="details" required></textarea>
      <button type="submit">Submit Report</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script>
    VANTA.GLOBE({
      el: "#background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xff0000,
      color2: 0xe3ff00,
      backgroundColor: 0x000000
    });

    const micButton = document.getElementById('micButton');
    const detailsInput = document.getElementById('details');
    const typeSelect = document.getElementById('typeOfEmergency');

    function detectEmergencyType(text) {
      text = text.toLowerCase();
      if (/fire|explosion|earthquake|damage|danger|destruction/.test(text)) return 'Natural Calamities/Destruction';
      if (/accident|injured|hurt|bleeding|medical|emergency/.test(text)) return 'Medical/Accident';
      if (/chemical|toxic|hazard|spill/.test(text)) return 'Hazard/Chemical';
      return 'Other';
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = event => {
        const transcript = event.results[0][0].transcript;
        detailsInput.value += (detailsInput.value ? ' ' : '') + transcript;
        typeSelect.value = detectEmergencyType(transcript);
      };

      recognition.onerror = event => {
        alert('Speech recognition error: ' + event.error);
      };

      micButton.addEventListener('click', () => {
        recognition.start();
      });
    } else {
      micButton.style.display = 'none';
    }

    document.getElementById('reportForm').addEventListener('submit', e => {
      e.preventDefault();
      const type = typeSelect.value;
      const details = detailsInput.value.trim();
      if (!type || !details) {
        alert('Please fill all fields');
        return;
      }
      const report = {
        id: Date.now(),
        type,
        details,
        date: new Date().toLocaleString()
      };
      let reports = JSON.parse(localStorage.getItem('reports')) || [];
      reports.push(report);
      localStorage.setItem('reports', JSON.stringify(reports));
      alert('Report saved locally!');
      e.target.reset();
    });
  </script>
</body>
</html>
