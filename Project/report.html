<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emergency Reporting with Location and Mic Icon</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      overflow: auto;
    }
    #background {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: -1;
    }
    .container {
      position: relative;
      max-width: 600px;
      margin: 2rem auto;
      background-color: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1;
    }
    .top-nav {
      text-align: right; margin-bottom: 1rem;
    }
    .top-nav a {
      background:#FFD700; padding: 0.6rem 1rem; border-radius:6px;
      text-decoration:none; color: #333; border: 1px solid #999;
      font-weight: bold;
    }
    .top-nav a:hover { background: #fff460; }
    label { display: block; margin-top: 1rem; }
    select, textarea {
      width: 100%; margin-top: 0.5rem; padding: 0.7rem;
      font-size: 1em; border-radius: 5px; border:1px solid #ccc;
      box-sizing: border-box;
    }
    textarea { resize: vertical; height: 100px; }
    button.submit-btn {
      margin-top: 1.5rem; width: 100%; padding: 0.8rem;
      font-size: 1em; border-radius: 5px; border: none;
      background-color: #4CAF50; color: rgb(255, 255, 255); cursor: pointer;
    }
    button.submit-btn:hover { background-color: #388E3C; }
    #micButton {
      background-color: #ff0000;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      margin-left: 10px;
      vertical-align: middle;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease;
    }
    #micIcon {
      fill: white;
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div class="container">
    <div class="top-nav">
      <a href="reports.html" target="_blank">View Live Reports</a>
    </div>
    <h2>Submit Emergency Report</h2>
    <form id="reportForm">
      <label for="typeOfEmergency">Type of Emergency</label>
      <select id="typeOfEmergency" required>
        <option value="">-- Select --</option>
        <option value="Medical/Accident">Medical/Accident</option>
        <option value="Hazard/Chemical">Hazard/Chemical</option>
        <option value="Natural Calamities/Destruction">Natural Calamities/Destruction</option>
        <option value="Other">Other</option>
      </select>
      <label for="details">Details
        <button type="button" id="micButton" title="Click to Speak" aria-label="Start speech recognition">
          <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z"/>
            <path d="M19 10v1a7 7 0 01-14 0v-1"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </label>
      <textarea id="details" required></textarea>
      <button type="submit" class="submit-btn">Submit Report</button>
    </form>
    <div id="locationMessage" style="margin-top:1rem; font-size:0.9rem; color:#555;"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script>
    VANTA.GLOBE({
      el: "#background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xff0000,
      color2: 0xe3ff00,
      backgroundColor: 0x000000
    });

    const micButton = document.getElementById('micButton');
    const detailsInput = document.getElementById('details');
    const typeSelect = document.getElementById('typeOfEmergency');
    const locationMessage = document.getElementById('locationMessage');

    let userLatitude = null;
    let userLongitude = null;
    let lastReportedPosition = null;

    // Calculate distance in meters between two lat-long points (Haversine formula)
    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Radius of earth in meters
      const dLat = degreesToRadians(lat2-lat1);
      const dLon = degreesToRadians(lon2-lon1);
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(degreesToRadians(lat1))*Math.cos(degreesToRadians(lat2)) *
            Math.sin(dLon/2)*Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    function degreesToRadians(deg) {
      return deg * (Math.PI/180);
    }

    function updateMicColor(distanceMeters) {
      // Map distance from 0 to 1000 meters with colors from red to green
      // 0-250 meters red, 250-500 orange, 500-750 yellow, 750+ green
      if (distanceMeters === null) {
        micButton.style.backgroundColor = '#ff0000';
        return;
      }
      if (distanceMeters < 250) micButton.style.backgroundColor = '#ff0000'; // red
      else if (distanceMeters < 500) micButton.style.backgroundColor = '#ff6600'; // orange
      else if (distanceMeters < 750) micButton.style.backgroundColor = '#ffff00'; // yellow
      else micButton.style.backgroundColor = '#00cc00'; // green
    }

    function detectEmergencyType(text) {
      text = text.toLowerCase();
      if (/fire|explosion|earthquake|damage|danger|destruction/.test(text)) return 'Natural Calamities/Destruction';
      if (/accident|injured|hurt|bleeding|medical|emergency/.test(text)) return 'Medical/Accident';
      if (/chemical|toxic|hazard|spill/.test(text)) return 'Hazard/Chemical';
      return 'Other';
    }

    // Setup Speech Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = event => {
        const transcript = event.results[0][0].transcript;
        detailsInput.value += (detailsInput.value ? ' ' : '') + transcript;
        typeSelect.value = detectEmergencyType(transcript);
      };

      recognition.onerror = event => {
        alert('Speech recognition error: ' + event.error);
      };

      micButton.addEventListener('click', () => {
        recognition.start();
      });
    } else {
      micButton.style.display = 'none';
    }


    // Get user location and watch position to update mic color dynamically
    function startLocationTracking() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLatitude = pos.coords.latitude;
            userLongitude = pos.coords.longitude;
            locationMessage.textContent = `Your location captured: ${userLatitude.toFixed(6)}, ${userLongitude.toFixed(6)}`;
            updateDistanceAndMicColor();
          }, err => {
            locationMessage.textContent = "Could not get location. Enable location services.";
          });

        // Watch position continuously changes and update mic color
        navigator.geolocation.watchPosition(
          pos => {
            userLatitude = pos.coords.latitude;
            userLongitude = pos.coords.longitude;
            updateDistanceAndMicColor();
          },
          err => {
            locationMessage.textContent = "Location tracking failed.";
          },
          {enableHighAccuracy: true, maximumAge: 10000, timeout: 5000}
        );
      } else {
        locationMessage.textContent = "Geolocation not supported by browser.";
      }
    }

    function updateDistanceAndMicColor() {
      // Get last reported position from localStorage (if any)
      const reports = JSON.parse(localStorage.getItem('reports') || '[]');
      if (reports.length === 0) {
        updateMicColor(null);
        return;
      }
      const lastReport = reports[reports.length - 1];
      lastReportedPosition = {lat: lastReport.latitude, lon: lastReport.longitude};
      if (userLatitude === null || userLongitude === null || lastReportedPosition.lat === null || lastReportedPosition.lon === null) {
        updateMicColor(null);
        return;
      }
      const dist = getDistanceFromLatLonInMeters(userLatitude, userLongitude, lastReportedPosition.lat, lastReportedPosition.lon);
      updateMicColor(dist);
      // Optionally update location message too
      locationMessage.textContent = `Current Location: ${userLatitude.toFixed(6)}, ${userLongitude.toFixed(6)}. Distance from last report: ${dist.toFixed(1)} m`;
    }

    startLocationTracking();

    // On submit save report with current location
    document.getElementById('reportForm').addEventListener('submit', e => {
      e.preventDefault();
      const type = typeSelect.value;
      const details = detailsInput.value.trim();

      if (!type || !details) {
        alert('Please fill all fields');
        return;
      }
      if (userLatitude === null || userLongitude === null) {
        alert('Waiting for location to be detected. Please allow location services.');
        return;
      }

      const report = {
        id: Date.now(),
        type,
        details,
        date: new Date().toLocaleString(),
        latitude: userLatitude,
        longitude: userLongitude
      };

      let reports = JSON.parse(localStorage.getItem('reports')) || [];
      reports.push(report);
      localStorage.setItem('reports', JSON.stringify(reports));
      alert('Report saved locally!');

      e.target.reset();
      locationMessage.textContent = 'Waiting for location...';
    });
  </script>
</body>
</html>
